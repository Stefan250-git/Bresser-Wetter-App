
name: BRESSER Wetterdaten archivieren

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bresser-wetterdaten
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Weathercloud installieren
        run: pip install weathercloud==0.1.5

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Daten- und Oberflächenlogik prüfen
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test-history.cjs
          node scripts/test-ui.cjs
          node scripts/test-pwa.cjs
          node scripts/test-structure.cjs

      - name: Wetterdaten abrufen
        env:
          WEATHERCLOUD_STATION: '1073176104'
        run: python scripts/collect.py

      - name: Messwerte speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Wetterdaten automatisch aktualisiert"
            git push
          fi

      # GITHUB_TOKEN commits do not trigger a branch-based Pages build.
      # Opt in only after Settings > Pages > Source has been set to GitHub Actions.
      - name: Pages-Dateien vorbereiten
        if: vars.WEATHER_PAGES_DEPLOY == 'true' && github.ref_name == github.event.repository.default_branch
        run: |
          mkdir -p _site
          cp index.html app.js history.js styles.css mobile.css sw.js icon.svg manifest.webmanifest _site/
          cp -r assets data _site/

      - name: Pages-Artefakt erstellen
        if: vars.WEATHER_PAGES_DEPLOY == 'true' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    if: vars.WEATHER_PAGES_DEPLOY == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktuelle Messdaten auf Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
